services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/cdis.db}
    volumes:
      - cdis-data:/data
    restart: unless-stopped

  # Optional Postgres:  docker compose --profile postgres up
  # then set DATABASE_URL=postgresql+psycopg://cdis:cdis@db:5432/cdis in .env
  db:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: cdis
      POSTGRES_PASSWORD: cdis
      POSTGRES_DB: cdis
    volumes:
      - cdis-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cdis"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  cdis-data:
  cdis-pg:
